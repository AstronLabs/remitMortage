name: Blue-Green Deployment

# Zero-downtime backend releases: deploy to the idle slot, run health checks,
# switch traffic via weighted Route 53 records (or DNS alias), then watch the
# new slot through a post-deploy health window and automatically roll back to
# the previous known-good slot if it fails. See docs/AUTOMATIC_ROLLBACK.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev, staging, production)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
        type: string
      disable_auto_rollback:
        description: 'Manual override: alert on a failed post-deploy health check but do NOT roll back (for an intentional deploy expected to trip a health signal, e.g. a migration)'
        required: false
        default: false
        type: boolean
      override_reason:
        description: 'Why auto-rollback is disabled (included in the alert). Required when disable_auto_rollback is set.'
        required: false
        default: ''
        type: string

env:
  AWS_REGION: us-east-1
  HEALTH_CHECK_PATH: /api/health
  HEALTH_CHECK_TIMEOUT_SECONDS: 300
  POST_SWITCH_SOAK_SECONDS: 60
  # Post-deploy health gate: how long the new slot is watched after the
  # traffic switch, and what counts as failing it.
  HEALTH_GATE_WINDOW_SECONDS: 300
  HEALTH_GATE_INTERVAL_SECONDS: 10
  HEALTH_GATE_MAX_CONSECUTIVE_FAILURES: 3
  HEALTH_GATE_MAX_ERROR_RATE: "0.05"
  HEALTH_GATE_MIN_REQUESTS: 20

jobs:
  determine-slots:
    name: Determine Active & Idle Slots
    runs-on: ubuntu-latest
    needs: validate-override
    outputs:
      active_slot: ${{ steps.identify.outputs.active_slot }}
      idle_slot: ${{ steps.identify.outputs.idle_slot }}
      active_service_arn: ${{ steps.identify.outputs.active_service_arn }}
      idle_service_arn: ${{ steps.identify.outputs.idle_service_arn }}
      active_service_url: ${{ steps.identify.outputs.active_service_url }}
      idle_service_url: ${{ steps.identify.outputs.idle_service_url }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Identifies which slot (blue/green) is currently active by reading
      # a tagged SSM parameter or Route 53 weight. Falls back to 'blue' if
      # no state exists yet (first-time setup).
      - name: Identify Active Slot
        id: identify
        run: |
          PARAM_NAME="/remitmortgage/${{ github.event.inputs.environment }}/active-slot"
          ACTIVE=$(aws ssm get-parameter --name "$PARAM_NAME" --query 'Parameter.Value' --output text 2>/dev/null || echo "blue")
          
          if [ "$ACTIVE" = "blue" ]; then
            IDLE="green"
          else
            IDLE="blue"
          fi
          
          echo "active_slot=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "idle_slot=$IDLE" >> "$GITHUB_OUTPUT"
          
          # Fetch ARNs and URLs from App Runner service names
          BLUE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='remit-mortgage-api-${{ github.event.inputs.environment }}-blue'].ServiceArn" --output text)
          GREEN_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='remit-mortgage-api-${{ github.event.inputs.environment }}-green'].ServiceArn" --output text)
          
          BLUE_URL=$(aws apprunner describe-service --service-arn "$BLUE_ARN" --query 'Service.ServiceUrl' --output text)
          GREEN_URL=$(aws apprunner describe-service --service-arn "$GREEN_ARN" --query 'Service.ServiceUrl' --output text)
          
          if [ "$ACTIVE" = "blue" ]; then
            echo "active_service_arn=$BLUE_ARN" >> "$GITHUB_OUTPUT"
            echo "idle_service_arn=$GREEN_ARN" >> "$GITHUB_OUTPUT"
            echo "active_service_url=$BLUE_URL" >> "$GITHUB_OUTPUT"
            echo "idle_service_url=$GREEN_URL" >> "$GITHUB_OUTPUT"
          else
            echo "active_service_arn=$GREEN_ARN" >> "$GITHUB_OUTPUT"
            echo "idle_service_arn=$BLUE_ARN" >> "$GITHUB_OUTPUT"
            echo "active_service_url=$GREEN_URL" >> "$GITHUB_OUTPUT"
            echo "idle_service_url=$BLUE_URL" >> "$GITHUB_OUTPUT"
          fi
          
          echo "✓ Active slot: $ACTIVE"
          echo "✓ Idle slot: $IDLE"

  deploy-idle:
    name: Deploy to Idle Slot
    runs-on: ubuntu-latest
    needs: determine-slots
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signed image before deployment
        env:
          IMAGE: public.ecr.aws/remitmortgage/backend:${{ github.event.inputs.image_tag }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/container-signing.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Idle App Runner Service
        run: |
          IMAGE="public.ecr.aws/remitmortgage/backend:${{ github.event.inputs.image_tag }}"
          aws apprunner update-service \
            --service-arn "${{ needs.determine-slots.outputs.idle_service_arn }}" \
            --source-configuration "{\"ImageRepository\":{\"ImageIdentifier\":\"$IMAGE\",\"ImageRepositoryType\":\"ECR_PUBLIC\"}}"
          
          echo "✓ Triggered deployment of $IMAGE to ${{ needs.determine-slots.outputs.idle_slot }} slot"

      - name: Wait for Idle Service to Stabilize
        run: |
          echo "Waiting for App Runner service to reach 'RUNNING' status..."
          for i in {1..60}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ needs.determine-slots.outputs.idle_service_arn }}" \
              --query 'Service.Status' --output text)
            
            if [ "$STATUS" = "RUNNING" ]; then
              echo "✓ Service is RUNNING"
              exit 0
            fi
            
            echo "[$i/60] Status: $STATUS, waiting..."
            sleep 10
          done
          
          echo "✗ Service did not reach RUNNING within 10 minutes"
          exit 1

  health-check-idle:
    name: Health Check Idle Slot
    runs-on: ubuntu-latest
    needs: [determine-slots, deploy-idle]
    steps:
      - name: Smoke Test Idle Slot
        run: |
          URL="https://${{ needs.determine-slots.outputs.idle_service_url }}${{ env.HEALTH_CHECK_PATH }}"
          echo "Running health checks against $URL"
          
          END=$((SECONDS + ${{ env.HEALTH_CHECK_TIMEOUT_SECONDS }}))
          while [ $SECONDS -lt $END ]; do
            if curl -sf --max-time 5 "$URL" > /dev/null; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Health check failed, retrying in 5s..."
            sleep 5
          done
          
          echo "✗ Health checks did not pass within timeout"
          exit 1

  switch-traffic:
    name: Switch Traffic to Idle Slot
    runs-on: ubuntu-latest
    needs: [determine-slots, health-check-idle]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # In production, this updates Route 53 weighted records, or an ALB target
      # group, or a CloudFront origin group. Here we update an SSM parameter so
      # the next run knows which slot is active, and log the swap.
      - name: Update Active Slot Pointer
        run: |
          PARAM_NAME="/remitmortgage/${{ github.event.inputs.environment }}/active-slot"
          aws ssm put-parameter \
            --name "$PARAM_NAME" \
            --value "${{ needs.determine-slots.outputs.idle_slot }}" \
            --type String \
            --overwrite
          
          echo "✓ Traffic switched from ${{ needs.determine-slots.outputs.active_slot }} → ${{ needs.determine-slots.outputs.idle_slot }}"

      # In a real setup, update Route 53 weights here:
      # aws route53 change-resource-record-sets --hosted-zone-id Z... --change-batch file://swap.json

      - name: Soak Period
        run: |
          echo "Soaking for ${{ env.POST_SWITCH_SOAK_SECONDS }}s to verify stability..."
          sleep ${{ env.POST_SWITCH_SOAK_SECONDS }}

  # Validates the override input up front so a disabled rollback is never
  # silent: an override without a reason is rejected before anything deploys.
  validate-override:
    name: Validate Rollback Override
    runs-on: ubuntu-latest
    steps:
      - name: Require a reason when auto-rollback is disabled
        if: github.event.inputs.disable_auto_rollback == 'true' && github.event.inputs.override_reason == ''
        run: |
          echo "::error::disable_auto_rollback requires override_reason so the override is auditable."
          exit 1

  post-deploy-health-gate:
    name: Post-Deploy Health Gate
    runs-on: ubuntu-latest
    needs: [determine-slots, switch-traffic]
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      action: ${{ steps.gate.outputs.action }}
      signal: ${{ steps.gate.outputs.signal }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      NEW_SLOT: ${{ needs.determine-slots.outputs.idle_slot }}
      PREVIOUS_SLOT: ${{ needs.determine-slots.outputs.active_slot }}
      AUTO_ROLLBACK_DISABLED: ${{ github.event.inputs.disable_auto_rollback }}
      OVERRIDE_REASON: ${{ github.event.inputs.override_reason }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEVOPS_ALERT_WEBHOOK_URL: ${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The formerly idle slot is now the active one. Watch its health
      # endpoint and (when reachable) its 5xx rate for the whole window; the
      # step always exits 0 and reports its verdict via outputs so the
      # rollback decision is explicit rather than an accident of exit codes.
      - name: Watch new active slot
        id: gate
        env:
          HEALTH_URL: https://${{ needs.determine-slots.outputs.idle_service_url }}${{ env.HEALTH_CHECK_PATH }}
          METRICS_URL: https://${{ needs.determine-slots.outputs.idle_service_url }}/metrics
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/post-deploy-health-gate.mjs gate

      - name: Alert on health check failure
        if: steps.gate.outputs.passed == 'false'
        run: node scripts/post-deploy-health-gate.mjs alert failure

      - name: Upload health gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-gate-report
          path: health-gate-report.json
          if-no-files-found: ignore
          retention-days: 30

      # A failed gate must fail the workflow whether or not a rollback follows
      # (including under the override), so a bad deploy is never reported green.
      - name: Fail the deployment
        if: steps.gate.outputs.passed == 'false'
        run: |
          echo "::error::Post-deploy health gate failed (${{ steps.gate.outputs.signal }}); action=${{ steps.gate.outputs.action }}"
          exit 1

  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: [determine-slots, post-deploy-health-gate]
    # Roll back when the gate said so — or when the gate itself crashed
    # (empty action): an unverified deploy is treated as a failed one. Never
    # when healthy, and never under the manual override.
    if: >-
      always() &&
      needs.post-deploy-health-gate.result != 'skipped' &&
      needs.post-deploy-health-gate.outputs.action != 'none' &&
      needs.post-deploy-health-gate.outputs.action != 'alert_only' &&
      github.event.inputs.disable_auto_rollback != 'true'
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      NEW_SLOT: ${{ needs.determine-slots.outputs.idle_slot }}
      PREVIOUS_SLOT: ${{ needs.determine-slots.outputs.active_slot }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEVOPS_ALERT_WEBHOOK_URL: ${{ secrets.DEVOPS_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The previous slot still runs the previous known-good image (the
      # deploy only ever touched the idle slot), so rolling back is flipping
      # the active-slot pointer back to it.
      - name: Restore previous active slot
        id: restore
        run: |
          PARAM_NAME="/remitmortgage/${{ github.event.inputs.environment }}/active-slot"
          aws ssm put-parameter \
            --name "$PARAM_NAME" \
            --value "${{ needs.determine-slots.outputs.active_slot }}" \
            --type String \
            --overwrite
          echo "✓ Active slot pointer restored to ${{ needs.determine-slots.outputs.active_slot }}"

      - name: Verify previous slot is healthy
        id: verify
        run: |
          URL="https://${{ needs.determine-slots.outputs.active_service_url }}${{ env.HEALTH_CHECK_PATH }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          if [ "$CODE" = "200" ]; then
            echo "health=healthy (HTTP $CODE)" >> "$GITHUB_OUTPUT"
          else
            echo "health=UNHEALTHY (HTTP $CODE)" >> "$GITHUB_OUTPUT"
            echo "::error::Previous slot is not healthy after rollback (HTTP $CODE)"
            exit 1
          fi

      - name: Alert rollback completed
        if: steps.restore.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          ROLLBACK_HEALTH: ${{ steps.verify.outputs.health }}
        run: node scripts/post-deploy-health-gate.mjs alert rollback

      - name: Alert rollback failed
        if: failure()
        env:
          ROLLBACK_HEALTH: ${{ steps.verify.outputs.health }}
        run: node scripts/post-deploy-health-gate.mjs alert rollback_failed

  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [determine-slots, post-deploy-health-gate, rollback]
    if: always()
    steps:
      - name: Deployment Success
        if: needs.post-deploy-health-gate.result == 'success'
        run: |
          echo "✅ Blue-green deployment succeeded and passed its post-deploy health window"
          echo "Active slot: ${{ needs.determine-slots.outputs.idle_slot }}"
          echo "Image: ${{ github.event.inputs.image_tag }}"

      - name: Deployment Failed and Rolled Back
        if: needs.post-deploy-health-gate.result != 'success' && needs.rollback.result == 'success'
        run: |
          echo "❌ Post-deploy health gate failed; automatically rolled back"
          echo "Active slot restored to: ${{ needs.determine-slots.outputs.active_slot }}"
          exit 1

      - name: Deployment Failed, Rollback Skipped or Failed
        if: needs.post-deploy-health-gate.result != 'success' && needs.rollback.result != 'success'
        run: |
          echo "❌ Post-deploy health gate failed and traffic was NOT automatically restored (rollback: ${{ needs.rollback.result }})"
          echo "Auto-rollback override: ${{ github.event.inputs.disable_auto_rollback }}"
          echo "Active slot: ${{ needs.determine-slots.outputs.idle_slot }} — see docs/AUTOMATIC_ROLLBACK.md"
          exit 1
