name: Stale Preview Environment Sweep

# Scheduled sweep that removes PR preview environments older than a
# configurable age, catching any preview the close/merge trigger
# (.github/workflows/preview-env-teardown.yml) missed. Also runs on demand
# via workflow_dispatch so an operator can force a cleanup pass.

on:
  schedule:
    # Daily at 02:30 UTC — outside peak contributor hours.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      max-age-days:
        description: "Remove previews older than this many days"
        type: number
        default: 14

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  STALE_ENV_MAX_AGE_DAYS: "14"

jobs:
  sweep:
    name: Sweep Stale Preview Environments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove Stale Preview Environments
        id: sweep
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          STALE_ENV_MAX_AGE_DAYS: >-
            ${{
              inputs.max-age-days != null && inputs.max-age-days != ''
              ? inputs.max-age-days
              : env.STALE_ENV_MAX_AGE_DAYS
            }}
        run: |
          chmod +x scripts/teardown-preview-env.sh
          scripts/teardown-preview-env.sh sweep "${STALE_ENV_MAX_AGE_DAYS}" \
            | tee /tmp/preview-sweep.log

      - name: Comment on Affected PRs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/preview-sweep.log', 'utf8');
            const done = log
              .split('\n')
              .filter((l) => l.startsWith('PREVIEW_TEARDOWN_DONE '));
            const removals = log
              .split('\n')
              .filter((l) => l.startsWith('PREVIEW_TEARDOWN '));

            if (done.length === 0) {
              console.log('No stale preview environments to remove.');
              return;
            }

            // Group the removed resources by PR for the comment.
            const perPr = {};
            for (const l of removals) {
              const [, pr, type, id] = l.split(' ');
              (perPr[pr] = perPr[pr] || []).push(`- \`${type}\`: \`${id}\``);
            }

            for (const l of done) {
              const [, pr, count] = l.split(' ');
              if (pr === 'unknown' || pr === '') {
                console.log(`Skipping comment for untagged preview (${count} resource(s) removed).`);
                continue;
              }
              const items = perPr[pr] || [];
              const body = [].concat(
                [
                  '## Stale Preview Environment Removed',
                  '',
                  `The preview environment for PR #${pr} was idle for longer than the configured stale threshold and was removed by the automated sweep.`,
                  '',
                  `Removed resources (${count}):`,
                ],
                items.length > 0 ? items : ['_none listed_'],
                ['', '> This environment was parked for the close/merge teardown to catch, but the scheduled sweep cleaned it up as a safety net.'],
              ).join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(pr),
                body,
              });
            }
