name: Staging Load Testing (k6)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bulk-approval-staging-load-test:
    name: Run concurrent admin bulk approval load test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run concurrent bulk approval test
        working-directory: backend
        run: npm run load-test:bulk-approval
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'https://staging-api.remitmortgage.com' }}
          ADMIN_JWT: ${{ secrets.STAGING_ADMIN_JWT }}
          BULK_APPROVAL_APPLICATION_IDS: ${{ secrets.BULK_APPROVAL_APPLICATION_IDS }}
          LOAD_CONNECTIONS: 10
          LOAD_DURATION: 30
          LOAD_P99_THRESHOLD_MS: 500
          LOAD_MAX_ERROR_RATE: 0.01
