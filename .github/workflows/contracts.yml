name: Contracts

# Dedicated CI/CD pipeline for the Soroban smart-contract workspace. Gates
# every pull request on exactly the checks the project wants for contracts:
# formatting, clippy, unit tests, the wasm32v1-none release build, and the
# errors.rs <-> ERROR_CODES.md sync check. Nothing else runs here.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind
# an already-outdated compilation.
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts -> target

      - name: Check Formatting
        run: cargo fmt --all -- --check
        working-directory: contracts

      - name: Lint with Clippy
        run: cargo clippy --lib -- -D warnings
        working-directory: contracts

  # ── Tests ───────────────────────────────────────────────────────────────
  test:
    name: Run Tests (cargo test --lib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts -> target

      - name: Run Library Unit Tests
        run: cargo test --lib
        working-directory: contracts
        env:
          PROPTEST_CASES: 256


  # ── Build ───────────────────────────────────────────────────────────────
  # integration-tests is a native std-based test-only crate and can never
  # target wasm32v1-none (which requires #![no_std]), so it's excluded here.
  build:
    name: Compile Contracts (wasm32v1-none release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts -> target

      - name: Build Soroban Contracts (release WASM)
        run: cargo build --target wasm32v1-none --release --workspace --exclude integration-tests
        working-directory: contracts

      - name: Upload Compiled WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: contracts/target/wasm32v1-none/release/*.wasm
          retention-days: 7
          if-no-files-found: error

  # ── Error Codes Sync ────────────────────────────────────────────────────
  error-codes-sync:
    name: error-codes-sync (errors.rs <-> ERROR_CODES.md)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check ERROR_CODES.md is in sync
        run: python3 scripts/check_error_codes_sync.py
