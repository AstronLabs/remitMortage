name: Migration Rollback Verification

# Fails a PR whose Prisma migration cannot be rolled back cleanly, or that is
# irreversible without a reviewed runbook entry.
on:
  pull_request:
    paths:
      - "backend/prisma/migrations/**"
      - "backend/prisma/rollback-manifest.json"
      - "backend/prisma/rollback-runbooks/**"
      - "backend/prisma/__snapshots__/**"
      - "backend/scripts/verify-migration-rollback.sh"
      - "backend/scripts/check-migration-rollbacks.ts"
      - "backend/src/services/migrationRollback.ts"
      - ".github/workflows/migration-rollback.yml"
  push:
    branches: [main]
    paths:
      - "backend/prisma/migrations/**"
      - "backend/prisma/rollback-manifest.json"
      - "backend/prisma/rollback-runbooks/**"
      - "backend/scripts/verify-migration-rollback.sh"
      - "backend/scripts/check-migration-rollbacks.ts"
      - "backend/src/services/migrationRollback.ts"
      - ".github/workflows/migration-rollback.yml"
  workflow_dispatch:

concurrency:
  group: migration-rollback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollback:
    name: Verify migration rollbacks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rollback_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Ensure PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Verify migration rollbacks
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rollback_check
        run: bash scripts/verify-migration-rollback.sh
