name: Workflow Permissions Audit

# Least-privilege audit for GITHUB_TOKEN permissions across every workflow in
# .github/workflows/. See scripts/check-workflow-permissions.mjs and
# docs/WORKFLOW_PERMISSIONS_AUDIT.md for the full ruleset.
#
#   check-changed   On a PR touching workflow files, audits only the
#                   files in that PR's diff and fails on ERROR-level
#                   findings (missing `permissions:`, `write-all`). This is
#                   the enforcement gate for new/edited workflows.
#   full-audit      Weekly (and on demand), audits every workflow file and
#                   files/updates a single tracking issue with the full
#                   report. Never fails the run — pre-existing findings are
#                   tracked for remediation, not used to block unrelated CI.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-permissions.mjs'
  schedule:
    # 09:00 UTC every Monday.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-changed:
    name: Audit Changed Workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find changed workflow files
        id: changed
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- '.github/workflows/*.yml' \
            | tr '\n' ' ')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Audit changed workflows
        if: steps.changed.outputs.files != ''
        run: node scripts/check-workflow-permissions.mjs ${{ steps.changed.outputs.files }}

      - name: Nothing to audit
        if: steps.changed.outputs.files == ''
        run: echo "No workflow files changed on this PR's diff."

  full-audit:
    name: Full Repository Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full audit
        id: audit
        run: |
          set +e
          node scripts/check-workflow-permissions.mjs --out workflow-permissions-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat workflow-permissions-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: workflow-permissions-report
          path: workflow-permissions-report.md
          retention-days: 90

      - name: Open or update tracking issue
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Workflow permissions audit: least-privilege findings';
            const body = [
              fs.readFileSync('workflow-permissions-report.md', 'utf8'),
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'See [`docs/WORKFLOW_PERMISSIONS_AUDIT.md`](../blob/main/docs/WORKFLOW_PERMISSIONS_AUDIT.md) for the policy and how to fix each finding.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-permissions-audit',
            });
            const open = existing.find((issue) => issue.title === title);

            if (open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
              core.info(`Updated existing tracking issue #${open.number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci', 'security', 'workflow-permissions-audit'],
              });
            }

      - name: Close tracking issue if clean
        if: steps.audit.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Workflow permissions audit: least-privilege findings';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-permissions-audit',
            });
            const open = existing.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: 'All workflow permission findings resolved by the latest audit run.',
              });
            }
