name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]

jobs:
  # ── Kubernetes Manifest Validation ──────────────────────────────────────
  k8s-manifest-validation:
    name: K8s Manifest Validation (kubeval & conftest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: Install conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz
          tar xf conftest_0.45.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Validate Schema with kubeval
        run: |
          kubeval --strict devops/k8s/*.yaml

      - name: Validate OPA Policies with conftest
        run: |
          conftest test --policy devops/k8s/policy devops/k8s/*.yaml

  # ── Backend CI ──────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Express & TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Check npm Registry Pinning
        run: node scripts/check-npm-registry-pinning.mjs

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: TypeScript Type Check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Session Fixation & Token Replay Prevention Security Check
        run: npm run test:security
        working-directory: backend

  # ── Backend Coverage ───────────────────────────────────────────────────
  # Coverage quality gate: `jest --coverage` exits non-zero when
  # statements/branches/functions/lines fall below the thresholds declared in
  # backend/package.json ("jest" > "coverageThreshold"). This turns coverage
  # from an informational report into a merge blocker.
  # Calibration policy: docs/TEST_COVERAGE_THRESHOLDS.md
  backend-coverage:
    name: Backend Coverage (Jest threshold gate)
    runs-on: ubuntu-latest
    needs: backend-ci
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Tests with Coverage Threshold Enforcement
        run: npm run test:coverage
        working-directory: backend

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 14

  # ── Frontend CI ─────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check npm Registry Pinning
        run: node scripts/check-npm-registry-pinning.mjs

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Keyboard Accessibility Checks
        run: npm run test:a11y
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm test -- --passWithNoTests --no-coverage
        working-directory: frontend

      - name: Build Next.js Application
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAWXDSZM52E5BW7G6TFX7DTXSHF7F75TUSSWW7B442NBEU3CADXNVTXH
          NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
          NEXT_PUBLIC_USDC_TOKEN_ID: CCERWUE35WN7M4PN6XYK7CDCJZX35TC53TFATJNBRA6I3FDS3RVS65YF
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"

  # ── Contracts Coverage ──────────────────────────────────────────────────
  contracts-coverage:
    name: Contracts Coverage (cargo-tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts -> target

      # Cache the compiled cargo-tarpaulin binary so it is not rebuilt from
      # source on every run. `cargo install` becomes a fast no-op on a cache hit.
      - name: Cache cargo-tarpaulin binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-cargo-tarpaulin-bin

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # `--fail-under` makes tarpaulin exit non-zero when total line coverage
      # regresses below the threshold, turning this job into a merge blocker
      # rather than an informational report. Calibration policy:
      # docs/TEST_COVERAGE_THRESHOLDS.md
      - name: Run Coverage
        run: cargo tarpaulin --out Xml --out Html --workspace --exclude-files "tests/**/*" --output-dir coverage/ --fail-under 55
        working-directory: contracts

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage-report
          path: contracts/coverage/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/coverage/cobertura.xml
          flags: contracts
          name: soroban-contracts
          fail_ci_if_error: false

  # ── Integration Tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
        run: npx prisma migrate deploy

      - name: Execute Integration Tests
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?schema=public
          HORIZON_URL: https://horizon.stellar.org
          JWT_SECRET: testing-secret
        run: npm run test:integration

  # ── Wallet Extension Multi-Browser E2E Tests ─────────────────────────────────
  wallet-e2e-tests:
    name: Wallet Extension E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend

      - name: Run Playwright Wallet Tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CAWXDSZM52E5BW7G6TFX7DTXSHF7F75TUSSWW7B442NBEU3CADXNVTXH
          NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
          NEXT_PUBLIC_USDC_TOKEN_ID: CCERWUE35WN7M4PN6XYK7CDCJZX35TC53TFATJNBRA6I3FDS3RVS65YF
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"

      - name: Upload Playwright Report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 14

