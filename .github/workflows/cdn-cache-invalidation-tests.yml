name: CDN Cache Invalidation Tests

# Unit tests for the script that invalidates and verifies CloudFront CDN edge caches.

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - "scripts/invalidate-cdn-cache.mjs"
      - "scripts/invalidate-cdn-cache.test.mjs"
      - ".github/workflows/blue-green-deploy.yml"
      - ".github/workflows/cdn-cache-invalidation-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: CDN Invalidation Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit tests
        run: node --test scripts/invalidate-cdn-cache.test.mjs
