name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]

jobs:
  npm-registry-pinning:
    name: npm Registry Pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check npm Registry Pinning
        run: node scripts/check-npm-registry-pinning.mjs

  # ── Session Fixation & Token Replay Prevention ─────────────────────────
  # Verifies resistance to session fixation attacks and token/signature
  # replay attacks across all supported chains, asserting that nonces are
  # single-use, pre-auth sessions are rotated, and expired nonces are rejected.
  session-fixation-replay-prevention:
    name: Session Fixation & Token Replay Prevention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Session Fixation and Token Replay Prevention Suite
        run: npm run test:security
        working-directory: backend

  # ── Rust Dependency Vulnerability Audit ─────────────────────────────────
  # Scans contracts/Cargo.lock against the RustSec advisory database.
  # cargo-audit exits non-zero on any matching advisory, which fails this
  # job and blocks the PR check.
  rust-dependency-audit:
    name: Rust Dependency Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts -> target

      # Cache the compiled cargo-audit binary so it is not rebuilt from
      # source on every run, mirroring the cargo-tarpaulin cache in ci.yml.
      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit
        working-directory: contracts

  # ── Dependency License Compliance ──────────────────────────────────────
  # Scans npm and Rust dependencies for license compliance on every PR,
  # failing the build with a clear report when a dependency declares a
  # license not in scripts/license-allowlist.json. The allowlist is
  # data-only: add a license id to that file to allow it — no workflow or
  # script changes needed.
  license-compliance:
    name: Dependency License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── npm licenses ──────────────────────────────────────────────────
      - name: Install npm license-checker
        run: npm install -g license-checker

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate npm license report
        run: license-checker --json --start . > /tmp/npm-licenses.json
        working-directory: backend

      - name: Check npm license compliance
        run: node scripts/license-compliance.js npm /tmp/npm-licenses.json scripts/license-allowlist.json

      # ── Rust licenses ─────────────────────────────────────────────────
      - name: Install cargo-license
        run: cargo install cargo-license --locked

      - name: Generate Rust license report
        run: cargo license --json > /tmp/cargo-licenses.json
        working-directory: contracts

      - name: Check Rust license compliance
        run: node scripts/license-compliance.js cargo /tmp/cargo-licenses.json scripts/license-allowlist.json


  trivy-backend-scan:
    name: Trivy Container Scan - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t remitmortgage-backend:${{ github.sha }} ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: remitmortgage-backend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

      - name: Generate Human-Readable Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: remitmortgage-backend:${{ github.sha }}
          format: 'table'
          output: 'trivy-backend-report.txt'

      - name: Upload Vulnerability Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend-report.txt

  trivy-frontend-scan:
    name: Trivy Container Scan - Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t remitmortgage-frontend:${{ github.sha }} ./frontend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: remitmortgage-frontend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'

      - name: Generate Human-Readable Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: remitmortgage-frontend:${{ github.sha }}
          format: 'table'
          output: 'trivy-frontend-report.txt'

      - name: Upload Vulnerability Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report
          path: trivy-frontend-report.txt

  snyk-backend-scan:
    name: Snyk Container Scan - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t remitmortgage-backend:${{ github.sha }} ./backend

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: remitmortgage-backend:${{ github.sha }}
          args: --severity-threshold=high --file=backend/Dockerfile

  snyk-frontend-scan:
    name: Snyk Container Scan - Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t remitmortgage-frontend:${{ github.sha }} ./frontend

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: remitmortgage-frontend:${{ github.sha }}
          args: --severity-threshold=high --file=frontend/Dockerfile

  # ── Subresource Integrity (SRI) Check ─────────────────────────────────────
  # Enforces fix.md #500: every third-party <script src="https://..."> or
  # <link rel="stylesheet" href="https://..."> must carry integrity + crossorigin.
  # Uses scripts/check-sri.py which understands sriProps() helper and skips
  # non-executable links (a href, fetch, img). Fails the job with GitHub
  # annotations so PRs cannot merge with un-hashed CDN loads.
  sri-check:
    name: SRI Check — third-party scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SRI checker
        run: python scripts/check-sri.py

      - name: Verify SRI helper can generate hashes
        run: |
          node frontend/scripts/sri-hash.mjs --text "test" | grep -q "sha384-"
          echo "sri-hash helper works"
