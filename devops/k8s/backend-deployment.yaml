apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitmortgage-backend
  namespace: remitmortgage
  labels:
    app: remitmortgage-backend
  annotations:
    secret.reloader.stakater.com/reload: remitmortgage-backend-secrets
spec:
  # No static replica count: the HPA owns this field once it takes over.
  replicas: 2
  selector:
    matchLabels:
      app: remitmortgage-backend
  template:
    metadata:
      labels:
        app: remitmortgage-backend
    spec:
      # Spread replicas across zones (hard) and nodes (soft) so a zone outage
      # or a single node drain cannot take every replica down at once.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: remitmortgage-backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: remitmortgage-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: remitmortgage-backend
      containers:
        - name: backend
          image: remitmortgage/backend:latest
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: remitmortgage-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remitmortgage-backend-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: remitmortgage-backend-secrets
                  key: redis-url
            - name: REDIS_CLUSTER_NODES
              valueFrom:
                secretKeyRef:
                  name: remitmortgage-backend-secrets
                  key: redis-cluster-nodes
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: remitmortgage-backend-secrets
                  key: otel-exporter-otlp-endpoint
          # CPU requests are mandatory for the HPA: utilization is computed as
          # a percentage of the request, not of the node capacity.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
