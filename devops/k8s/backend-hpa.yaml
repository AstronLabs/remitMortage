apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitmortgage-backend
  namespace: remitmortgage
  labels:
    app: remitmortgage-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitmortgage-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale out once average CPU across pods exceeds 80% of the request.
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleUp:
      # React quickly to traffic spikes.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Wait for utilization to genuinely settle before removing capacity,
      # so a bursty workload does not thrash replicas up and down.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
