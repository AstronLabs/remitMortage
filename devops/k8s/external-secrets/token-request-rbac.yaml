apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-token-request
  namespace: remitmortgage
  labels:
    app.kubernetes.io/name: remitmortgage-external-secrets
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["external-secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-token-request
  namespace: remitmortgage
  labels:
    app.kubernetes.io/name: remitmortgage-external-secrets
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: remitmortgage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-token-request
