# Apply this file in staging only. It grants staging the ability to read a
# production read-only replica credential for the anonymized seed job.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: production-readonly-secrets
  namespace: remitmortgage
  labels:
    app.kubernetes.io/name: remitmortgage
spec:
  refreshInterval: 5m
  refreshPolicy: Periodic
  secretStoreRef:
    name: remitmortgage-aws-secrets
    kind: SecretStore
  target:
    name: production-readonly-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: remitmortgage/production/database-readonly
        property: databaseUrl
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: staging-db-secrets
  namespace: remitmortgage
  labels:
    app.kubernetes.io/name: remitmortgage
spec:
  refreshInterval: 5m
  refreshPolicy: Periodic
  secretStoreRef:
    name: remitmortgage-aws-secrets
    kind: SecretStore
  target:
    name: staging-db-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: remitmortgage/REPLACE_WITH_ENVIRONMENT/staging-database
        property: databaseUrl
