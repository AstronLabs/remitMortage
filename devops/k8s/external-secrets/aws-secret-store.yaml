apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: remitmortgage-aws-secrets
  namespace: remitmortgage
  labels:
    app.kubernetes.io/name: remitmortgage
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_WITH_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
