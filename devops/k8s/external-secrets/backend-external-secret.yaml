apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: remitmortgage-backend-secrets
  namespace: remitmortgage
  labels:
    app.kubernetes.io/name: remitmortgage
spec:
  refreshInterval: 5m
  refreshPolicy: Periodic
  secretStoreRef:
    name: remitmortgage-aws-secrets
    kind: SecretStore
  target:
    name: remitmortgage-backend-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: remitmortgage/REPLACE_WITH_ENVIRONMENT/backend
        property: databaseUrl
    - secretKey: redis-url
      remoteRef:
        key: remitmortgage/REPLACE_WITH_ENVIRONMENT/backend
        property: redisUrl
    - secretKey: redis-cluster-nodes
      remoteRef:
        key: remitmortgage/REPLACE_WITH_ENVIRONMENT/backend
        property: redisClusterNodes
    - secretKey: otel-exporter-otlp-endpoint
      remoteRef:
        key: remitmortgage/REPLACE_WITH_ENVIRONMENT/backend
        property: otelExporterOtlpEndpoint
