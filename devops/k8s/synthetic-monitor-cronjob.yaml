# Kubernetes CronJob for running synthetic uptime checks from multiple regions.
#
# This CronJob probes critical API endpoints and records results as Prometheus
# metrics. The Blackbox Exporter handles the actual HTTP probing, while this
# CronJob orchestrates multi-region checks and ensures probe targets are
# registered.
#
# Deploy with: kubectl apply -f synthetic-monitor-cronjob.yaml

apiVersion: batch/v1
kind: CronJob
metadata:
  name: synthetic-uptime-check
  namespace: remitmortage
  labels:
    app: synthetic-monitor
    component: uptime
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: synthetic-monitor
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9115"
            prometheus.io/path: "/metrics"
        spec:
          serviceAccountName: synthetic-monitor
          restartPolicy: OnFailure
          containers:
            - name: probe
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting synthetic uptime checks..."
                  
                  # Endpoints to probe
                  ENDPOINTS="/api/health /api/auth /api/loan/pending"
                  
                  # Backend URL (from ConfigMap or env)
                  BACKEND_URL="${BACKEND_URL:-https://api.remitmortgage.com}"
                  
                  # Region identifier (set via downward API)
                  REGION="${REGION:-unknown}"
                  
                  FAILED=0
                  TOTAL=0
                  
                  for endpoint in $ENDPOINTS; do
                    TOTAL=$((TOTAL + 1))
                    START=$(date +%s%N)
                    
                    HTTP_CODE=$(wget -q -O /dev/null \
                      --timeout=10 \
                      --tries=1 \
                      --server-response \
                      "${BACKEND_URL}${endpoint}" 2>&1 | grep "HTTP/" | awk '{print $2}' | tail -1)
                    
                    END=$(date +%s%N)
                    DURATION_MS=$(( (END - START) / 1000000 ))
                    
                    if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
                      echo "OK: ${endpoint} (${HTTP_CODE}) ${DURATION_MS}ms [${REGION}]"
                    else
                      echo "FAIL: ${endpoint} (${HTTP_CODE:-timeout}) ${DURATION_MS}ms [${REGION}]"
                      FAILED=$((FAILED + 1))
                    fi
                  done
      
                  echo "Results: $((TOTAL - FAILED))/${TOTAL} passed from ${REGION}"
                  
                  if [ $FAILED -gt 0 ]; then
                    echo "WARNING: ${FAILED} endpoint(s) failed"
                    exit 1
                  fi
              env:
                - name: BACKEND_URL
                  valueFrom:
                    configMapKeyRef:
                      name: synthetic-monitor-config
                      key: backend-url
                - name: REGION
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['topology.kubernetes.io/region']
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

---
# ServiceAccount for the synthetic monitor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synthetic-monitor
  namespace: remitmortage

---
# ConfigMap for synthetic monitor configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: synthetic-monitor-config
  namespace: remitmortage
data:
  backend-url: "https://api.remitmortgage.com"
  check-interval: "120"
  latency-threshold-ms: "2000"
  failure-threshold: "3"
