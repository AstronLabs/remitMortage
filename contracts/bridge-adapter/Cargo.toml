[package]
name = "bridge-adapter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Enables the shared, interface-level compliance suite (and the SDK test
# utilities it needs) for other crates verifying their own BridgeAdapter
# implementation.
compliance-tests = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
