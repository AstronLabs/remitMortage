[workspace]
resolver = "2"
members = [
    "escrow",
    "bridge-adapter",
    "governance",
    "insurance-pool",
    "integration-tests",
    "lending-pool",
    "milestone",
    "multisig-validator",
    "oracle-price",
    "staking-pool",
    "verification-registry",
    "yield-vault",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
